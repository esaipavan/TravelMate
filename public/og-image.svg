<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="50%" style="stop-color:#312e81"/>
      <stop offset="100%" style="stop-color:#4c1d95"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ambient glow circles -->
  <circle cx="200" cy="150" r="300" fill="#6366f1" opacity="0.08" filter="url(#blur)"/>
  <circle cx="1000" cy="480" r="250" fill="#8b5cf6" opacity="0.10" filter="url(#blur)"/>
  <circle cx="600" cy="315" r="200" fill="#4f46e5" opacity="0.06" filter="url(#blur)"/>

  <!-- Grid lines (subtle) -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#6366f1" stroke-width="0.5" opacity="0.15"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#6366f1" stroke-width="0.5" opacity="0.15"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="#6366f1" stroke-width="0.5" opacity="0.15"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="#6366f1" stroke-width="0.5" opacity="0.15"/>

  <!-- Accent bar -->
  <rect x="80" y="200" width="6" height="180" rx="3" fill="url(#accent)"/>

  <!-- Icon mark -->
  <g transform="translate(80, 120)">
    <rect width="64" height="64" rx="16" fill="url(#accent)"/>
    <text x="32" y="44" font-size="34" text-anchor="middle" fill="white">✈</text>
  </g>

  <!-- Main headline -->
  <text x="112" y="265" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="72" font-weight="800" fill="white" letter-spacing="-2">TravelMate</text>

  <!-- Tagline -->
  <text x="115" y="320" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="400" fill="#a5b4fc" letter-spacing="0.5">Plan trips · Track expenses · Explore the world</text>

  <!-- Feature pills -->
  <g transform="translate(115, 360)">
    <rect width="160" height="40" rx="20" fill="#6366f1" opacity="0.25"/>
    <text x="80" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#a5b4fc" text-anchor="middle">AI Companion</text>

    <rect x="176" width="160" height="40" rx="20" fill="#6366f1" opacity="0.25"/>
    <text x="256" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#a5b4fc" text-anchor="middle">Smart Budget</text>

    <rect x="352" width="178" height="40" rx="20" fill="#6366f1" opacity="0.25"/>
    <text x="441" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#a5b4fc" text-anchor="middle">Travel Documents</text>

    <rect x="546" width="158" height="40" rx="20" fill="#6366f1" opacity="0.25"/>
    <text x="625" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#a5b4fc" text-anchor="middle">Offline Ready</text>
  </g>

  <!-- Right side decorative card -->
  <g transform="translate(820, 100)">
    <rect width="300" height="420" rx="24" fill="white" opacity="0.04"/>
    <rect width="300" height="420" rx="24" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.3"/>

    <!-- Card content rows -->
    <rect x="20" y="24" width="180" height="12" rx="6" fill="#6366f1" opacity="0.4"/>
    <rect x="20" y="48" width="130" height="8" rx="4" fill="#4f46e5" opacity="0.3"/>

    <line x1="20" y1="72" x2="280" y2="72" stroke="#6366f1" stroke-width="0.5" opacity="0.3"/>

    <!-- Mock trip cards -->
    <rect x="20" y="88" width="260" height="80" rx="12" fill="#6366f1" opacity="0.12"/>
    <rect x="36" y="104" width="80" height="10" rx="5" fill="#a5b4fc" opacity="0.6"/>
    <rect x="36" y="122" width="120" height="8" rx="4" fill="#6366f1" opacity="0.4"/>
    <rect x="36" y="138" width="60" height="8" rx="4" fill="#8b5cf6" opacity="0.5"/>
    <text x="250" y="136" font-size="20" text-anchor="middle" fill="#a5b4fc" opacity="0.8">🗼</text>

    <rect x="20" y="184" width="260" height="80" rx="12" fill="#8b5cf6" opacity="0.10"/>
    <rect x="36" y="200" width="100" height="10" rx="5" fill="#a5b4fc" opacity="0.5"/>
    <rect x="36" y="218" width="140" height="8" rx="4" fill="#6366f1" opacity="0.35"/>
    <rect x="36" y="234" width="50" height="8" rx="4" fill="#8b5cf6" opacity="0.4"/>
    <text x="250" y="232" font-size="20" text-anchor="middle" fill="#a5b4fc" opacity="0.7">🏯</text>

    <rect x="20" y="280" width="260" height="80" rx="12" fill="#4f46e5" opacity="0.12"/>
    <rect x="36" y="296" width="90" height="10" rx="5" fill="#a5b4fc" opacity="0.45"/>
    <rect x="36" y="314" width="110" height="8" rx="4" fill="#6366f1" opacity="0.3"/>
    <rect x="36" y="330" width="70" height="8" rx="4" fill="#8b5cf6" opacity="0.4"/>
    <text x="250" y="328" font-size="20" text-anchor="middle" fill="#a5b4fc" opacity="0.65">🏔</text>

    <!-- Bottom stat -->
    <line x1="20" y1="376" x2="280" y2="376" stroke="#6366f1" stroke-width="0.5" opacity="0.3"/>
    <rect x="20" y="390" width="70" height="8" rx="4" fill="#a5b4fc" opacity="0.3"/>
    <rect x="120" y="390" width="70" height="8" rx="4" fill="#a5b4fc" opacity="0.3"/>
    <rect x="220" y="390" width="60" height="8" rx="4" fill="#a5b4fc" opacity="0.3"/>
  </g>

  <!-- Bottom URL -->
  <text x="115" y="570" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#6366f1" opacity="0.6">travelmate.vercel.app</text>

  <!-- Beta badge -->
  <g transform="translate(980, 548)">
    <rect width="120" height="36" rx="18" fill="url(#accent)" opacity="0.9"/>
    <text x="60" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="white" text-anchor="middle" letter-spacing="2">BETA</text>
  </g>
</svg>
