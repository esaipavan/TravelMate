    <!-- ── JSON-LD Structured Data ───────────────────────────────────── -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "TravelMate",
        "url": "https://travel-planner-eight-sandy.vercel.app",
        "description": "Free AI-powered trip planner for Indian travellers. Plan itineraries, track budgets in ₹, get AI travel insights. Free forever, no credit card needed.",
        "applicationCategory": "TravelApplication",
        "operatingSystem": "Any",
        "availableLanguage": "en-IN",
        "keywords": "trip planner India, travel budget tracker, AI travel assistant, group trip planner",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "INR"
        },
        "author": {
          "@type": "Person",
          "name": "Sai Pavan Etikala",
          "url": "https://github.com/esaipavan"
        },
        "featureList": [
          "AI Travel Concierge with 8 intelligent modules",
          "Day-by-day itinerary builder with drag-and-drop",
          "Expense tracking with 30+ live currency rates",
          "Travel journal with AI narrative generation",
          "Real-time weather forecasts via Open-Meteo",
          "Collaboration with role-based access",
          "Document vault with expiry tracking",
          "Analytics dashboard with 6 chart types"
        ]
      }
    </script>

    <!-- ── FAQPage Structured Data ──────────────────────────────────── -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Is TravelMate really free?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes — completely free, forever. No premium tier, no trial period. All features including the AI Concierge, budget tracking, and real-time collaboration are included at zero cost."
            }
          },
          {
            "@type": "Question",
            "name": "Do I need to enter a credit card?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Never. TravelMate is free forever. We ask for nothing except your Google account to sign in."
            }
          },
          {
            "@type": "Question",
            "name": "Why is TravelMate free? What's the business model?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "TravelMate is free because we believe travel planning tools shouldn't cost money. In the future, we plan to sustain the service through optional premium features. Core planning, budgeting, and AI features will stay free forever."
            }
          },
          {
            "@type": "Question",
            "name": "Is this safe for storing passport documents?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Documents you upload are stored with end-to-end encryption and Row-Level Security — only you and group members you explicitly share with can access them."
            }
          },
          {
            "@type": "Question",
            "name": "Will this work for trips within India — trains, domestic flights, Tier 2 cities?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. TravelMate works for any trip, anywhere in India or the world. Users plan Manali road trips, Kerala backwaters, and IRCTC train journeys — all with the same AI companion."
            }
          },
          {
            "@type": "Question",
            "name": "Can my whole group use this together?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Absolutely. Invite friends with owner, editor, or viewer roles. Changes sync in real time and the budget split handles even complex group expenses automatically."
            }
          },
          {
            "@type": "Question",
            "name": "Is my personal travel data safe?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "All data is stored with Row-Level Security enforced at the database level. We never sell your data to airlines, hotels, or advertisers."
            }
          },
          {
            "@type": "Question",
            "name": "Does it work offline?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. TravelMate is a Progressive Web App with a service worker that caches your trip data. You can install it on your phone's home screen and access core features without internet."
            }
          },
          {
            "@type": "Question",
            "name": "Can I export my trip data?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Export generates a PDF of your full itinerary, budget summary, and expense log — ready to share or print before you travel."
            }
          },
          {
            "@type": "Question",
            "name": "How do I install TravelMate on my phone?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Open TravelMate in Chrome on your phone, tap the menu and select Add to Home Screen. The app installs with a native-app experience and works offline."
            }
          }
        ]
      }
    </script>
  </head>
