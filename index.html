<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />

    <!-- ── Viewport & theme ──────────────────────────────────────────── -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1D4ED8" />

    <!-- ── Primary SEO ───────────────────────────────────────────────── -->
    <title>TravelMate — Free AI Trip Planner for Indian Travellers</title>
    <meta
      name="description"
      content="TravelMate is the free AI trip planner built for Indian travellers. Plan itineraries, track budgets in ₹, get AI travel insights, and travel smarter. Free forever. No credit card needed."
    />
    <meta
      name="keywords"
      content="travel planner India, trip planning app India, expense tracker travel, travel budget India, AI travel assistant India, itinerary builder India, group trip planner India, rupee travel budget, Goa trip planner, Ladakh trip planning, travel app India, free travel planner"
    />
    <meta name="author" content="Sai Pavan Etikala" />
    <link rel="canonical" href="https://travelmate.vercel.app/" />

    <!-- Google Search Console: paste verification code here when ready -->
    <!-- <meta name="google-site-verification" content="YOUR_CODE" /> -->

    <!-- ── Open Graph ─────────────────────────────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TravelMate" />
    <meta property="og:title" content="TravelMate — Free AI Trip Planner for Indian Travellers" />
    <meta
      property="og:description"
      content="Plan itineraries, track budgets in ₹, get AI travel insights. Free forever, no credit card needed. Built for trips across India and the world."
    />
    <meta property="og:url" content="https://travel-planner-eight-sandy.vercel.app/" />
    <meta property="og:image" content="https://travel-planner-eight-sandy.vercel.app/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TravelMate — AI trip planner for Indian travellers" />
    <meta property="og:locale" content="en_IN" />

    <!-- ── Twitter / X Card ──────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TravelMate — Free AI Trip Planner for Indian Travellers" />
    <meta
      name="twitter:description"
      content="Plan itineraries, track budgets in ₹, get AI travel insights. Free forever, no credit card needed."
    />
    <meta name="twitter:image" content="https://travelmate.vercel.app/og-image.svg" />
    <meta name="twitter:creator" content="@esaipavan" />

    <!-- ── Robots ─────────────────────────────────────────────────────── -->
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- ── Favicons & PWA ─────────────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TravelMate" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="TravelMate" />

    <!-- ── Fonts ──────────────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- ── JSON-LD Structured Data ───────────────────────────────────── -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "TravelMate",
        "url": "https://travelmate.vercel.app",
        "description": "Free AI-powered trip planner for Indian travellers. Plan itineraries, track budgets in ₹, get AI travel insights. Free forever, no credit card needed.",
        "applicationCategory": "TravelApplication",
        "operatingSystem": "Any",
        "availableLanguage": "en-IN",
        "keywords": "trip planner India, travel budget tracker, AI travel assistant, group trip planner",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "INR"
        },
        "author": {
          "@type": "Person",
          "name": "Sai Pavan Etikala",
          "url": "https://github.com/esaipavan"
        },
        "featureList": [
          "AI Travel Concierge with 8 intelligent modules",
          "Day-by-day itinerary builder with drag-and-drop",
          "Expense tracking with 30+ live currency rates",
          "Travel journal with AI narrative generation",
          "Real-time weather forecasts via Open-Meteo",
          "Collaboration with role-based access",
          "Document vault with expiry tracking",
          "Analytics dashboard with 6 chart types"
        ]
      }
    </script>
